<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>David A. Bednar</td>
            <td>BYU-Idaho 25th Anniversary Devotional</td>
            <td>I-Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Elder James O. Fantone</td>
            <td>The Battle Is the Lord's</td>
            <td>I-Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Rob Garrett</td>
            <td>He Will Make More Out of You</td>
            <td>I-Center</td>
            <td>2026</td>
          </tr>
        </table>
          <form method="dialog">
            <input type="text" id="speaker" placeholder="Favorite speaker:" required>
            <input type="text" id="title" placeholder="Title:" required>
            <input type="text" id="location" placeholder="Location:" required>
            <input type="text" id="year" placeholder="Year:" required>
            <div id="submit">
              <button class="btn" type="submit">Submit</button>
              <button class="btn-cancel" type="button">Cancel</button>
            </div>
          </form>
      </div>
    </main>
  </div>
</body>
</html>
