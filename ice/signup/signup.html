<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>
    <link href="styles/styles.css" rel="stylesheet">
</head>

<body>
    <div id="formContainer">
        <div id="hero">
            <button type="button" id="closeBtn">X</button>
            <div class="hero-text">
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>
            </div>
            <img id="mainImg" src="images/jesus_feeds_5000.jpeg" alt="Daily Scripture Feed">
        </div>

        <form id="myForm">
            <h3>Sign Up for Daily Scripture Feed</h3>

            <div class="form-row">   
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-row" id="gender-row">
                <label class="row-label">Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                </div>
            </div>

            <div class="checkbox-row" id="newsletter">
                <input type="checkbox" id="newsletter-check" name="newsletter">
                <label for="newsletter-check">Subscribe to newsletter</label>
            </div>

            <div class="checkbox-row" id="terms">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </div>

            <div id="submit">
                <button type="submit">Submit</button>
            </div>
        </form>

        <div id="image">
            <img id="oldTestament" src="images/old_testament.webp" alt="Old Testament">
            <img id="newTestament" src="images/new_testament.webp" alt="New Testament">
            <img id="BOM" src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img id="d&c" src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img id="pearlOfPrice" src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
